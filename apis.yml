description: Mekan (somosmekan.com) is a Latin American software platform serving the
  automotive sector, with solutions organized around two product lines - Autos (vehicles)
  and Repuestos (auto parts / spare parts) - to help dealers, parts sellers, and automotive
  businesses manage and grow their operations. Backed by 500 Global, the company was
  surfaced as a portfolio-company lead and added to the API Evangelist network. At the
  time of enrichment the public surface is a Spanish-language marketing site centered
  on a "Agenda tu demo" (schedule-a-demo) flow, with WhatsApp and LinkedIn contact
  channels and no publicly documented API, developer portal, SDKs, or technical
  integration surface.
